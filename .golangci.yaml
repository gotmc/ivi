version: "2"

linters:
  default: standard
  enable:
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - errcheck
    - gosec
    - misspell
    - bodyclose
    - contextcheck
  disable:
    # unused is part of the standard set, so it has to be disabled explicitly
    # rather than just left out of the enable list above.
    - unused

formatters:
  enable:
    - gofmt
    - goimports
    - golines

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
